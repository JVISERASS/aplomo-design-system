name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run parity
      # Prueba que el artefacto de ng-packagr se instala y enlaza en una app Angular limpia.
      # Bloquea la publicacion, que es donde ese fallo saldria caro.
      - run: npm run smoke:angular
      # Los tokens primero: los otros dos paquetes los declaran como dependencia.
      - run: npm publish -w @jviserass/aplomo-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @jviserass/aplomo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # El paquete Angular se publica desde la salida de ng-packagr, no desde el fuente.
      - run: npm publish packages/angular/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
