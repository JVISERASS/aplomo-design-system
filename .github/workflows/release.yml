name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear la GitHub Release y adjuntarle los tarballs
    env:
      # El contexto `secrets` no existe en un `if` de paso: hay que exponerlo como variable
      # de entorno del job para poder condicionar la publicacion en npm a que haya token.
      # Se aceptan los dos nombres: `NPM` es el secreto vigente y `NPM_TOKEN` el historico.
      # Sin esto, un secreto con el otro nombre da un 404 de npm en el PUT --que es lo que npm
      # devuelve, en vez de un 403, cuando falla la autenticacion sobre un paquete con scope--
      # y se diagnostica como un problema de permisos que no existe.
      NPM_TOKEN: ${{ secrets.NPM || secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      # --- Las cinco puertas ---
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run parity
      # Prueba que el artefacto de ng-packagr se instala y enlaza en una app Angular limpia.
      # Bloquea la publicacion, que es donde ese fallo saldria caro.
      - run: npm run smoke:angular

      # --- Distribucion por GitHub ---
      # Los mismos tarballs que irian a npm, para que no haya dos caminos que puedan divergir.
      - name: Empaquetar los tres paquetes
        run: |
          mkdir -p release-artifacts
          npm pack ./packages/tokens  --pack-destination release-artifacts
          npm pack ./packages/react   --pack-destination release-artifacts
          npm pack ./packages/angular/dist --pack-destination release-artifacts
          ls -la release-artifacts

      - name: Crear la GitHub Release con los tarballs adjuntos
        # Idempotente: si la Release ya existe --porque una ejecucion anterior llego hasta aqui
        # y fallo despues-- se le suben los tarballs en vez de abortar el reintento.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Distribucion por npm ---
      # Solo si hay token configurado: sin el, la Release de GitHub ya es utilizable y el
      # workflow no tiene por que fallar.
      - name: Publicar en npm
        if: env.NPM_TOKEN != ''
        run: |
          # `--access public` va explicito: con un scope de organizacion, npm publica
          # RESTRINGIDO por defecto y el `publishConfig.access` del package.json no basta
          # cuando se publica con `-w` desde la raiz del monorepo. Sin esto, los paquetes
          # salen privados y dan 404 a cualquiera que no sea miembro de la organizacion.
          # Los tokens primero: los otros dos paquetes los declaran como dependencia.
          npm publish -w @jviserass/aplomo-tokens --access public
          npm publish -w @jviserass/aplomo --access public
          # El paquete Angular se publica desde la salida de ng-packagr, no desde el fuente.
          npm publish packages/angular/dist --access public
        env:
          # Del `env` del job, NO de `secrets.NPM_TOKEN` otra vez: si no, el `if` de arriba
          # comprueba un token y el `npm publish` usa otro distinto, que es como se publico
          # con el secreto caducado mientras el paso parecia estar bien configurado.
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
