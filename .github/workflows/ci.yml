name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Cuarta puerta: ninguna declaracion de estilo ni token --ap-* se pierde en el port.
      - run: npm run parity
      # Quinta puerta: ninguna version comprometida conocida en el arbol de dependencias.
      # npm audit no cubre esto: solo conoce vulnerabilidades con CVE publicado.
      - run: npm run supply-chain
      # Sexta puerta: el catalogo de Storybook de Angular refleja el de React. Que compile no
      # dice nada de si faltan stories o de si un titulo se desvio.
      - run: npm run stories
