# Diagnostico del token de npm. No publica nada.
#
# npm devuelve 404 --y no 403-- cuando falla la autenticacion sobre un paquete con scope, para no
# filtrar si existe. Eso hace que "token invalido", "token sin permiso de escritura" y "paquete
# inexistente" se vean exactamente igual desde el log de una publicacion fallida. Este workflow
# separa los tres casos sin gastar una version.
#
# Uso:  gh workflow run npm-doctor.yml
name: npm doctor

on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM || secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Hay token, y que forma tiene
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::no hay ningun secreto NPM ni NPM_TOKEN en el repositorio"
            exit 1
          fi
          echo "longitud: ${#NPM_TOKEN} caracteres"
          echo "prefijo:  $(printf '%s' "$NPM_TOKEN" | cut -c1-4)..."
          echo
          echo "  npm_ + 36 chars  -> token clasico (Automation o Publish)"
          echo "  npm_ + ~60 chars -> token granular"
          echo "  cualquier otra cosa -> no es un token de npm"

      - name: Quien soy segun npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          echo "--- npm whoami ---"
          if npm whoami; then
            echo "el token autentica"
          else
            echo "::error::el token NO autentica: caducado, revocado, o copiado con espacios/saltos"
            exit 1
          fi

      - name: A que da acceso de escritura
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          echo "--- npm access list packages ---"
          npm access list packages 2>&1 | head -40 || true
          echo
          echo "--- version publicada hoy de cada paquete ---"
          for p in @jviserass/aplomo-tokens @jviserass/aplomo @jviserass/aplomo-angular; do
            printf '%-32s ' "$p"
            npm view "$p" version 2>&1 | head -1
          done

      - name: Simulacro de publicacion, sin publicar
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          echo "--- npm publish --dry-run sobre el paquete de tokens ---"
          echo "    (--dry-run NO prueba la autenticacion: empaqueta y para)"
          npm publish ./packages/tokens --access public --dry-run 2>&1 | tail -6 || true

      # La prueba que de verdad decide. `whoami` pasa con un token de solo lectura, y
      # `--dry-run` ni siquiera llega al registro, asi que ninguno de los dos distingue
      # "puede publicar" de "no puede". Anadir y quitar un dist-tag SI es una escritura
      # real contra el registro, es reversible, y no publica ninguna version nueva.
      - name: Veredicto - puede escribir este token?
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          PKG=@jviserass/aplomo-tokens
          VER=$(npm view "$PKG" version)
          echo "escribiendo un dist-tag de prueba en $PKG@$VER ..."
          if npm dist-tag add "$PKG@$VER" ci-write-probe 2>&1; then
            npm dist-tag rm "$PKG" ci-write-probe 2>&1 || true
            echo
            echo "VEREDICTO: el token PUEDE escribir. Si `npm publish` sigue fallando,"
            echo "           el problema no es el token."
          else
            echo
            echo "::error::VEREDICTO: el token autentica pero NO puede escribir."
            echo "::error::Es de solo lectura. Hace falta un token con permiso de escritura:"
            echo "::error::  npmjs.com > Access Tokens > Generate New Token"
            echo "::error::  - Granular: Packages and scopes = @jviserass, permiso Read and write"
            echo "::error::  - o Classic: tipo Automation (no Read-only)"
            exit 1
          fi
