<header class="ap-page-header-root">
  <div class="ap-page-header-main">
    @if (eyebrow()) {
      <div class="ap-page-header-eyebrow">{{ eyebrow() }}</div>
    }
    <h1 class="ap-page-header-title">{{ title() }}</h1>
    <div class="ap-page-header-meta">
      <ng-content select="[apMeta]" />
    </div>
  </div>
  <div class="ap-page-header-actions">
    <ng-content select="[apActions]" />
  </div>
</header>
