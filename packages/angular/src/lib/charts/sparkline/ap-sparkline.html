<svg
  [class.ap-sparkline-svg]="data().length > 0"
  [attr.width]="width()"
  [attr.height]="height()"
  [attr.viewBox]="data().length ? '0 0 ' + width() + ' ' + height() : null"
  [attr.role]="data().length ? 'img' : null"
>
  @if (data().length) {
    <path
      [attr.d]="geometry().path"
      fill="none"
      [attr.stroke]="color()"
      stroke-width="1.25"
      stroke-linejoin="round"
      vector-effect="non-scaling-stroke"
    />
    @if (showLast() && geometry().last; as last) {
      <rect [attr.x]="last.x" [attr.y]="last.y" width="3" height="3" [attr.fill]="color()" />
    }
  }
</svg>
