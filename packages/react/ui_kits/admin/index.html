<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Aplomo — Panel de administracion</title>
<link rel="stylesheet" href="../../../tokens/styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<script src="./ns.js"></script>
<style>html,body{height:100%}body{margin:0;background:var(--ap-surface);overflow:hidden}#root{height:100%}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="./OverviewView.jsx"></script>
<script type="text/babel" src="./ServicesView.jsx"></script>
<script type="text/babel" src="./DeploymentsView.jsx"></script>
<script type="text/babel" src="./IncidentsView.jsx"></script>
<script type="text/babel" src="./SettingsView.jsx"></script>
<script type="text/babel" src="./AdminShell.jsx"></script>
<script type="text/babel">
const NEEDED=['OverviewView','ServicesView','DeploymentsView','IncidentsView','SettingsView','AdminShell'];
const ready=()=>NEEDED.every(k=>typeof window[k]==='function');
const mount=()=>{ if(!ready()) return setTimeout(mount,50); ReactDOM.createRoot(document.getElementById('root')).render(<AdminShell/>); };
mount();
</script>
</body></html>
