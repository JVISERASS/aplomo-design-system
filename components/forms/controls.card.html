<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ap-surface);color:var(--ap-text);font:var(--ap-text-ui);font-variation-settings:var(--ap-vf-prose)}#root{padding:18px 24px}.lab{font:var(--ap-text-micro);letter-spacing:.04em;text-transform:uppercase;color:var(--ap-text-muted);margin-bottom:8px}.grp{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:18px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.AplomoDesignSystem_c0efc3;

const {Radio,SegmentedControl,Textarea}=NS;
function Demo(){
  const [s,setS]=React.useState("canary"),[v,setV]=React.useState("Tabla"),[u,setU]=React.useState("ms");
  return (<div className="col">
    <div className="grp" style={{gap:40}}>
      <div><div className="lab">Radio</div>
        <Radio name="st" value={s} onChange={setS} options={[{value:"canary",label:"Canaria",hint:"5% / 25% / 100%"},{value:"bg",label:"Azul-verde",hint:"Cambio en caliente"},{value:"direct",label:"Directa"}]}/></div>
      <div style={{display:"grid",gap:16}}>
        <div><div className="lab">SegmentedControl</div><SegmentedControl value={v} onChange={setV} options={["Tabla","Lista","Matriz"]}/></div>
        <div><div className="lab">SegmentedControl · dato, sm</div><SegmentedControl data size="sm" value={u} onChange={setU} options={["ms","s","min"]}/></div>
      </div>
    </div>
    <div><div className="lab">Textarea</div><Textarea rows={2} placeholder="Motivo del cambio — queda en la auditoria" style={{maxWidth:420}}/></div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
