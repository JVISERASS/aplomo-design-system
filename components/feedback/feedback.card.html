<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ap-surface);color:var(--ap-text);font:var(--ap-text-ui);font-variation-settings:var(--ap-vf-prose)}#root{padding:20px 24px}.lab{font:var(--ap-text-micro);letter-spacing:.04em;text-transform:uppercase;color:var(--ap-text-muted);margin-bottom:8px}.grp{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.AplomoDesignSystem_c0efc3;

const {InlineAlert,Tooltip,Menu,Dialog,EmptyState,Button,IconButton}=NS;
function Demo(){const [m,setM]=React.useState(false),[d,setD]=React.useState(false);
return (<div className="col">
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
<InlineAlert tone="warn" title="Latencia p95 por encima del objetivo">Dos nodos de eu-central-1 llevan 14 min degradados.</InlineAlert>
<InlineAlert tone="ok" title="Despliegue completado">Version 4.18.2 activa en 12 regiones.</InlineAlert>
</div>
<div className="grp" style={{gap:20}}>
<Tooltip label="p95 de las ultimas 24 h"><span style={{font:"var(--ap-text-small)",color:"var(--ap-text-secondary)",borderBottom:"1px dashed var(--ap-border-strong)"}}>Tooltip</span></Tooltip>
<div style={{position:"relative"}}><IconButton icon="more-horizontal" label="Mas acciones" selected={m} onClick={()=>setM(!m)}/>
<Menu open={m} onClose={()=>setM(false)} anchor="left" items={[{value:"drain",label:"Drenar trafico",icon:"activity",shortcut:"D"},{value:"clone",label:"Duplicar",icon:"copy",shortcut:"⌘D"},{divider:true},{value:"del",label:"Retirar de produccion",icon:"trash-2",tone:"danger"}]}/></div>
<Button size="sm" onClick={()=>setD(true)}>Abrir dialogo</Button>
</div>
<EmptyState title="Ningun servicio coincide con estos filtros" description="Quita la region o amplia el intervalo de tiempo." action={<Button size="sm">Limpiar filtros</Button>} style={{padding:"20px 0 0"}}/>
<Dialog open={d} onClose={()=>setD(false)} title="Retirar SVC-4820-DE de produccion" description="El trafico se drenara durante 5 minutos antes de retirar el servicio. La operacion no es reversible." footer={<><Button onClick={()=>setD(false)}>Cancelar</Button><Button variant="danger" solid onClick={()=>setD(false)}>Retirar</Button></>}/>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
