<!-- @dsCard group="Components" viewport="700x260" name="Movimiento" subtitle="Stagger (cascada) y SharedValue (el identificador viaja al detalle)" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ap-surface);color:var(--ap-text);font:var(--ap-text-ui);font-variation-settings:var(--ap-vf-prose)}#root{padding:16px 24px}.lab{font:var(--ap-text-micro);letter-spacing:.04em;text-transform:uppercase;color:var(--ap-text-muted);margin-bottom:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Stagger,SharedValue,DataValue,DataTable,Badge,Button,Panel}=window.AplomoDesignSystem_c0efc3;
const rows=[{id:"1",ref:"SVC-4820-DE",name:"Facturacion",p95:"128 ms"},{id:"2",ref:"SVC-4821-DE",name:"Conciliacion",p95:"184 ms"},{id:"3",ref:"SVC-3390-US",name:"Pasarela de pagos",p95:"96 ms"}];
const cols=[{key:"ref",label:"Referencia",width:"148px",data:true,shared:true},{key:"name",label:"Servicio",width:"1fr"},{key:"p95",label:"p95",width:"80px",align:"right",data:true}];
function Demo(){
  const [sel,setSel]=React.useState(null),[k,setK]=React.useState(0),refs=React.useRef({});
  const row=rows.find(r=>r.id===sel);
  return (<div style={{display:"grid",gridTemplateColumns:"1fr 220px",gap:20,alignItems:"start"}}>
    <div><div className="lab">Stagger — pulsa para repetir la cascada</div>
      <Stagger key={k} step={60}><Panel><DataTable columns={cols} rows={rows} selectedId={sel} onSelectRow={r=>{SharedValue.capture(r.id,refs.current[r.id]);setSel(r.id);}} rowRef={(id,el)=>{refs.current[id]=el;}}/></Panel></Stagger>
      <div style={{marginTop:12}}><Button size="sm" onClick={()=>{setK(k+1);setSel(null);}}>Repetir entrada</Button></div></div>
    <div><div className="lab">SharedValue — abre una fila</div>
      <div style={{border:"1px solid var(--ap-border-strong)",borderRadius:8,boxShadow:"var(--ap-shadow-2)",padding:12,minHeight:96}}>
        {row?<><SharedValue sharedKey={row.id} style={{font:"var(--ap-weight-bold) var(--ap-size-19)/1.2 var(--ap-font-core)",letterSpacing:"-0.02em"}}>{row.ref}</SharedValue>
          <div style={{marginTop:8}}><Badge tone="ok">ACTIVO</Badge></div>
          <div style={{marginTop:10}}><DataValue value={row.p95} size="var(--ap-size-16)" weight={500}/></div></>:
          <div style={{font:"var(--ap-text-small)",color:"var(--ap-text-muted)"}}>Sin seleccion</div>}
      </div></div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
