<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--ap-surface);color:var(--ap-text);font:var(--ap-text-ui);font-variation-settings:var(--ap-vf-prose)}.wrap{padding:20px 24px}.grid{display:flex;gap:12px}.s{flex:1;padding:10px 12px;border-radius:5px}.k{font:var(--ap-text-micro);font-variation-settings:var(--ap-vf-data);letter-spacing:.04em}.v{font:var(--ap-text-small);margin-top:4px}</style></head><body><div class="wrap"><div class="grid">
<div class="s" style="background:var(--ap-ok-tint);border:1px solid color-mix(in srgb,var(--ap-ok) 16%,transparent);color:var(--ap-ok)"><div class="k">CORRECTO · #1B6B4C</div><div class="v">Despliegue completado</div></div>
<div class="s" style="background:var(--ap-warn-tint);border:1px solid color-mix(in srgb,var(--ap-warn) 16%,transparent);color:var(--ap-warn)"><div class="k">ATENCION · #8A6314</div><div class="v">Latencia degradada</div></div>
<div class="s" style="background:var(--ap-error-tint);border:1px solid color-mix(in srgb,var(--ap-error) 16%,transparent);color:var(--ap-error)"><div class="k">ERROR · #A32E22</div><div class="v">Nodo sin respuesta</div></div>
</div></div></body></html>
